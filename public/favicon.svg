<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;display=swap');
      .logo-bg {
        fill: #111317;
        stroke: #3c4a42;
        stroke-width: 1.5px;
      }
      .logo-text {
        font-family: 'Source Serif 4', 'Georgia', 'Times New Roman', serif;
        font-weight: 700;
        fill: #4edea3;
        font-size: 24px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  <!-- Background with rounded corners matching the UI logo button -->
  <rect width="30" height="30" x="1" y="1" rx="8" class="logo-bg" />
  <!-- Center letter 'ρ' (rho) -->
  <text x="16" y="16" class="logo-text">ρ</text>
</svg>
